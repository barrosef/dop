# A docker-compose EXCLUSIVE to DOP — the LOCAL environment (no cloud deploy / no CI-CD).
# An initial skeleton: services, ports, images and env will be finalized once the
# dop-api and dop-app stacks are defined.
# Superseded by dop-infra (the dop-infra spec §6); kept until it is removed.
name: dop

services:
  dop-api:
    build:
      context: ../repos/dop-api
      dockerfile: ../../infra/dop-api.Dockerfile
    # ports: ["8787:8787"]        # TODO: the API's port
    # env_file: [./.env]
    # depends_on: [db]
    profiles: ["full"]

  dop-app:
    build:
      context: ../repos/dop-app
      dockerfile: ../../infra/dop-app.Dockerfile
    # ports: ["5180:80"]          # TODO: the frontend's port (nginx)
    # depends_on: [dop-api]
    profiles: ["full"]

